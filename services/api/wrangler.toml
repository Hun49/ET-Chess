name = "et-chess-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "et-chess-db"
database_id = "local-et-chess-db"

[durable_objects]
bindings = [
  { name = "GAME_ROOM", class_name = "GameRoomDO" },
  { name = "MATCHMAKER", class_name = "MatchmakerDO" },
  { name = "TOURNAMENT", class_name = "TournamentDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoomDO", "MatchmakerDO", "TournamentDO"]
